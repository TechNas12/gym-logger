
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>

    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#15803d" stop-opacity="0.1" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10.24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base background (full bleed) -->
  <rect width="512" height="512" rx="112.64" fill="url(#bgGrad)" />

  
  <!-- Outer subtle border -->
  <rect x="10.24" y="10.24" width="491.52" height="491.52" rx="102.4" fill="none" stroke="url(#glowRing)" stroke-width="7.68" />
  

  <!-- Artwork Group with scaling -->
  <g transform="translate(38.400000000000006, 38.400000000000006) scale(0.85)">
    <!-- Center ambient glow -->
    <circle cx="256" cy="256" r="143.36" fill="#22c55e" opacity="0.12" filter="url(#neonGlow)" />

    <!-- Dumbbell Graphic (Diagonal 45deg) centered at (size*0.5, size*0.5) -->
    <g transform="rotate(-35, 256, 256)">
      <!-- Main Bar / Handle -->
      <rect 
        x="153.6" 
        y="243.2" 
        width="204.8" 
        height="25.6" 
        rx="10.24" 
        fill="url(#metalGrad)" 
      />

      <!-- Handle Knurling Rings -->
      <line x1="230.4" y1="243.2" x2="230.4" y2="268.8" stroke="#71717a" stroke-width="4.096" />
      <line x1="256" y1="243.2" x2="256" y2="268.8" stroke="#71717a" stroke-width="4.096" />
      <line x1="281.6" y1="243.2" x2="281.6" y2="268.8" stroke="#71717a" stroke-width="4.096" />

      <!-- Left Outer Plate Cap -->
      <rect 
        x="97.28" 
        y="204.8" 
        width="20.48" 
        height="102.4" 
        rx="7.68" 
        fill="url(#metalGrad)" 
      />

      <!-- Left Big Plate -->
      <rect 
        x="122.88" 
        y="163.84" 
        width="30.72" 
        height="184.32" 
        rx="12.8" 
        fill="url(#emeraldGrad)" 
        filter="url(#neonGlow)"
      />

      <!-- Left Inner Plate Collar -->
      <rect 
        x="153.6" 
        y="220.16" 
        width="12.8" 
        height="71.68" 
        rx="5.12" 
        fill="#27272a" 
      />

      <!-- Right Inner Plate Collar -->
      <rect 
        x="345.6" 
        y="220.16" 
        width="12.8" 
        height="71.68" 
        rx="5.12" 
        fill="#27272a" 
      />

      <!-- Right Big Plate -->
      <rect 
        x="358.4" 
        y="163.84" 
        width="30.72" 
        height="184.32" 
        rx="12.8" 
        fill="url(#emeraldGrad)" 
        filter="url(#neonGlow)"
      />

      <!-- Right Outer Plate Cap -->
      <rect 
        x="394.24" 
        y="204.8" 
        width="20.48" 
        height="102.4" 
        rx="7.68" 
        fill="url(#metalGrad)" 
      />
    </g>

    <!-- Modern Typography badge at bottom if size >= 192 -->
    
    <text 
      x="256" 
      y="450.56" 
      font-family="system-ui, -apple-system, sans-serif" 
      font-weight="900" 
      font-size="40.96" 
      fill="#f4f4f5" 
      text-anchor="middle" 
      letter-spacing="7.68"
    >GYM<tspan fill="#22c55e">LOGGER</tspan></text>
    
  </g>
</svg>
